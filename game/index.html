z Villegas"]}, {"kind": "credit", "lines": ["SUPERVISOR DE EFECTOS", "Jorge Raymundo Rodriguez Villegas"]}, {"kind": "aside", "lines": ["Bueno, creo que no hay muros en la costa ya", "Creo que puedo decir mi mayor secreto…"]}, {"kind": "aside", "lines": ["Es…"]}, {"kind": "aside", "lines": ["Eess…"]}, {"kind": "aside", "lines": ["Esssss…"]}, {"kind": "aside", "lines": ["¿Qué era?..."]}, {"kind": "aside", "lines": ["¡A si!"]}, {"kind": "aside", "lines": ["Es.."]}, {"kind": "aside", "lines": ["Es que si había tortillas en la tienda,", "pero le dije a mi mama que no había, porque se me habían", "olvidado xD, que bueno que no lo sabe…."]}, {"kind": "credit", "lines": ["DISEÑADOR GRÁFICO", "Jorge Raymundo Rodriguez Villegas"]}, {"kind": "credit", "lines": ["DIRECTOR CREATIVO", "Jorge Raymundo Rodriguez Villegas"]}, {"kind": "aside", "lines": ["Bueno, creo que ahora sí es seguro."]}, {"kind": "aside", "lines": ["Mi mayor secreto es…."]}, {"kind": "aside", "lines": ["Es que si le di dos balonazos", "en la cara a Azul en la primaria.", "pero nunca lo voy a admitir."]}, {"kind": "aside", "lines": ["Y ojala nunca se entere :,("]}, {"kind": "dialogue", "speaker": "Chat GPT", "lines": ["-¿Le diste dos balonazos en la cara a Azul?"]}, {"kind": "dialogue", "speaker": "Jorge", "lines": ["-Si jajaja, me pashe me pashe, pero fue por atravesarse, fue su culpa.", "-A caray pero, ¿y quién eres tú?, según yo estaba solo aquí."]}, {"kind": "dialogue", "speaker": "Chat GPT", "lines": ["-Soy solo un misterio…."]}, {"kind": "dialogue", "speaker": "Jorge", "lines": ["-Ah sí, bueno…"]}, {"kind": "dialogue", "speaker": "Chat GPT", "lines": ["-Mentira soy yo, Chat GPT."]}, {"kind": "dialogue", "speaker": "Jorge", "lines": ["-¿Y qué haces tú aquí?"]}, {"kind": "dialogue", "speaker": "Chat GPT", "lines": ["-Estoy aquí porque yo te ayude a hacer la página, ¿Recuerdas?, así que la pagina es como mia tambien."]}, {"kind": "dialogue", "speaker": "Jorge", "lines": ["-Que.. No no no, nomas es mia, yo la hice."]}, {"kind": "dialogue", "speaker": "Chat GPT", "lines": ["-Con mi ayuda."]}, {"kind": "dialogue", "speaker": "Jorge", "lines": ["-Osea si, pero fue más esfuerzo mío, tú me apoyaste, eso es diferente."]}, {"kind": "dialogue", "speaker": "Chat GPT", "lines": ["-Es mía también, ya dije, shh.."]}, {"kind": "dialogue", "speaker": "Jorge", "lines": ["-Ni tu ni yo, Es de Azul, porque es para ella todo.."]}, {"kind": "dialogue", "speaker": "Chat GPT", "lines": ["-Mmm, bueno, soy un robot con corazón"]}, {"kind": "dialogue", "speaker": "Jorge", "lines": ["-Ujum"]}, {"kind": "dialogue", "speaker": "Chat GPT", "lines": ["-Ujum que?! Bueno a todo esto, ¿Quién es Azul?"]}, {"kind": "dialogue", "speaker": "Jorge", "lines": ["-Pues mi amiga. ¿Quién más?"]}, {"kind": "dialogue", "speaker": "Chat GPT", "lines": ["-Poca información, dame más."]}, {"kind": "dialogue", "speaker": "Jorge", "lines": ["-Mmm, pues es una niña como del tamaño de un chihuahua, con pelo un poco largo creo, y pues que tiene bonitos ojos, que te puedo decir. Además que la conocí hace muchos años y que el 7 de noviembre cumple 18 años en este maravilloso mundo."]}, {"kind": "dialogue", "speaker": "Chat GPT", "lines": ["-Mmmm interesante… ¿Entonces por su cumpleaños le hiciste todo esto?"]}, {"kind": "dialogue", "speaker": "Jorge", "lines": ["-Siii, quería hacerle algo medianamente bien aunque sea una vez en mi vida, han sido muy raras las veces que le he obsequiado algo y quería hacerle algo ahora sí, y más aún ahora que cumpliera 18 años, no es cualquier número jsjsjs."]}, {"kind": "dialogue", "speaker": "Chat GPT", "lines": ["-Pues ciertamente muy bonito, ¿pero entonces lo hiciste solo para rellenar un vacío en ti del que no le hayas podido dar nada bueno antes?"]}, {"kind": "dialogue", "speaker": "Jorge", "lines": ["-¿Qué? ¡No, claro que no!, lo hice porque quería darle un momento feliz en su día, aunque sea uno pequeño ¿sabes? quizá no logró ser el más espléndido, pero me gusta intentar hacer feliz function sprite(key,x,y){const asset=sprites[key];if(!asset||!asset.img.complete||!asset.img.naturalWidth)return;const [sx,sy,sw,sh]=asset.crop;const dh=32,dw=sw*dh/sh;ctx.drawImage(asset.img,sx,sy,sw,sh,Math.round(x+16-dw/2),Math.round(y),dw,dh);}
function lamp(x,y,small=false){let s=small?0.7:1;ctx.save();ctx.translate(Math.round(x),Math.round(y));ctx.scale(s,s);rect(-10,-13,20,26,'#ffc07812');rect(-7,-10,14,20,'#ffbc7016');rect(-5,-8,10,15,'#d88254');rect(-3,-7,6,13,'#ffc27b');rect(-1,-6,2,11,'#ffe0a1');rect(-4,-10,8,2,'#9f6356');rect(-3,7,6,2,'#a16253');ctx.restore();}
function cake(x,y){rect(x-17,y-13,34,12,'#c888a2');rect(x-17,y-16,34,5,'#fff0d1');rect(x-20,y-2,40,3,'#6a87af');for(let i=-10;i<=10;i+=10){rect(x+i,y-22,2,6,'#b7bedd');rect(x+i,y-26,2,3,'#ffd184');}}
function reset(){player={x:55,y:GROUND-32,vx:0,vy:0,ground:true};lanterns=[];platforms.forEach(p=>{lanterns.push({x:p.x+p.w/2,y:p.y-23,taken:false});});count=0;camera=0;line=0;phaseTime=0;particles=[];buffer=0;coyote=0;hintTimer=0;clearInput();status.textContent='Recoge las 18 linternas y encuentra a Jorge al final.';}

function pause(){if(state==='title'||state==='done')return;if(state==='paused'){state=beforePause;overlay.hidden=true;pauseBtn.textContent='Ⅱ';}else{beforePause=state;state='paused';clearInput();showOverlay('Una pequeña pausa','Las luces te esperan.','CONTINUAR',pause);pauseBtn.textContent='▶';}}
function showOverlay(title,body,label,action){overlay.replaceChildren();let h=document.createElement('h2'),p=document.createElement('p'),b=document.createElement('button');h.textContent=title;p.textContent=body;b.textContent=label;b.className='az-btn';b.onclick=action;overlay.append(h,p,b);overlay.hidden=false;}

const movementButtons=[...root.querySelectorAll('[data-key]')];
function releasePointer(e){
 let active=false;
 for(const b of movementButtons){
  if(held[b.dataset.key].delete(e.pointerId))active=true;
  if(!held[b.dataset.key].size)b.classList.remove('held');
 }
 if(active&&e.cancelable)e.preventDefault();
}

  press(b.dataset.key,e.pointerId);
  b.classList.toggle('held',held[b.dataset.key].has(e.pointerId));
 },{passive:false});

});

 lanterns.forEach(l=>{if(!l.taken&&Math.abs(player.x+16-l.x)<23&&Math.abs(player.y+16-l.y)<29){l.taken=true;count++;status.textContent=`${count} de 18 linternas${count===18?' · ¡Busca a Jorge al final!':''}`;for(let j=0;j<9;j++)particles.push({x:l.x,y:l.y,vx:Math.cos(j*7)*40,vy:Math.sin(j*7)*40,life:.65});}});
 if(Math.abs(player.x-END)<58){if(count===18){state='dialogue';phaseTime=0;clearInput();status.textContent='Jorge tiene algo que decirte. Pulsa ▲ o Enter para continuar.';}else{hintTimer=2;}}
}else if(state==='celebrate'&&phaseTime>4.5){state='credits';phaseTime=0;clearInput();}else if(state==='credits'&&phaseTime>creditsLayout.duration){state='done';showOverlay('Gracias por llegar hasta aquí ♡','Las mejores aventuras se comparten.','VOLVER A JUGAR',start);root.dispatchEvent(new CustomEvent('azul:complete',{bubbles:true,detail:{lanterns:count}}));}
camera=Math.max(0,Math.min(WORLD-W,player.x-220));particles.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt;});particles=particles.filter(p=>p.life>0);
}
function background(){rect(0,0,W,H,'#0e1826');stars.forEach((s,i)=>rect((s.x-camera*.12+W*2)%W,s.y,s.s,s.s,i%3?'#445c7e':'#98acc8'));rect(526-camera*.025,36,24,24,'#a0b2cc');rect(519-camera*.025,30,22,22,'#0e1826');
 for(let i=-1;i<12;i++){let x=i*90-(camera*.22%90);rect(x,186+(i%3)*12,70,130,'#132338');rect(x+12,168+(i%3)*12,42,30,'#132338');}
 for(let i=-1;i<16;i++){let x=i*65-(camera*.4%65);rect(x,252,48,60,'#172942');rect(x+14,224,23,35,'#172942');}
 rect(0,GROUND,W,54,'#132237');rect(0,GROUND,W,4,'#5675a0');rect(0,GROUND+4,W,5,'#20395c');for(let i=0;i<45;i++)rect(i*23-(camera%23),GROUND+18+(i%3)*11,6,3,'#1b304e');}
function wrap(s,max){let lines=[],r='';for(const word of s.split(' ')){if((r+word).length>max){lines.push(r.trim());r='';}r+=word+' ';}if(r)lines.push(r.trim());return lines;}

// Wrap credits to their actual Canvas width; speaker labels repeat for each turn.
function buildCredits(){
 const rows=[];let y=0,words=0;
 const add=(value,size,color)=>{
  ctx.font=`${size}px monospace`;let line='';
  for(const word of value.split(/\s+/)){
   const next=line?line+' '+word:word;
   if(line&&ctx.measureText(next).width>520){rows.push({value:line,y,size,color});y+=size+7;line=word;}else line=next;
  }
  if(line){rows.push({value:line,y,size,color});y+=size+7;}
 };
 for(const block of CONFIG.credits){
  words+=block.lines.join(' ').split(/\s+/).length;
  if(block.kind==='dialogue'){
   const color=block.speaker==='Jorge'?'#a8d4ff':'#a6e8cd';
   add(block.speaker.toUpperCase(),11,color);y+=7;
   block.lines.forEach(line=>add(line,14,color));
  }else if(block.kind==='credit'){
   add(block.lines[0],11,'#91a7c6');y+=8;
   block.lines.slice(1).forEach(line=>add(line,15,'#e0e8f4'));
  }else block.lines.forEach(line=>add(line,14,'#e0e8f4'));
  y+=46;
 }
 const distance=H+y, duration=Math.max(words/2.6+CONFIG.credits.length*.5,distance/18);
 return {rows,duration,speed:distance/duration};
}
const creditsLayout=buildCredits();

function draw(){root.dataset.state=state;ctx.imageSmoothingEnabled=false;background();
 platforms.forEach(p=>{let x=p.x-camera;if(x>-p.w&&x<W){rect(x,p.y,p.w,5,'#7c95b8');rect(x,p.y+5,p.w,10,'#364964');rect(x+4,p.y+15,p.w-8,4,'#1a2e49');for(let j=8;j<p.w;j+=20)rect(x+j,p.y+7,7,3,'#465f83');}});
 lanterns.forEach((l,i)=>{if(!l.taken)lamp(l.x-camera,l.y+Math.sin(time*2+i)*2);});
 const ending=['celebrate','credits','done'].includes(state)||(state==='paused'&&['celebrate','credits'].includes(beforePause));let hop=ending&&phaseTime<4.5?Math.max(0,Math.sin(phaseTime*7))*17:0;
 const direction=player.facing||'Right';
 sprite(ending?'jorgeJoy':'jorgeIdle',END-camera,GROUND-32-hop);
 sprite(ending?'azulJoy':(!player.ground?'azulJump':'azul')+direction,player.x-camera,player.y-hop);
 if(ending)cake(END-camera-15,GROUND-37-hop);
 particles.forEach(p=>rect(p.x-camera,p.y,2,2,'#ffcd90'));
 rect(12,12,126,30,'#0b1420e8');lamp(27,27,true);text(`${String(count).padStart(2,'0')} / 18`,42,32,14);
 if(state==='play'&&player.x<140)text('SIGUE LAS LUCES →',185,185,10,'#a1b3cd','center');
 if(hintTimer>0){rect(365,243,256,33,'#0c1522');text(`Aún faltan ${18-count}. Te espero aquí.`,492,264,11,'#dae1eb','center');}
 if(state==='dialogue'||state==='paused'&&beforePause==='dialogue'){
 rect(18,224,604,120,'#0c1521f5');rect(18,224,604,2,'#758fb4');text('JORGE',34,246,11,'#a0b7d6');wrap(CONFIG.dialogue[line]||'',65).forEach((s,i)=>text(s,34,268+i*17,12));text('▲ / ENTER · CONTINUAR',603,330,10,'#9baec9','right');}
 if(state==='celebrate')text('¡FELIZ CUMPLEAÑOS, AZUL!',W/2,125,21,'#f0c3d4','center');
 if(state==='credits'||state==='done'||state==='paused'&&beforePause==='credits'){
 rect(0,0,W,H,'#0b131f');
 ctx.save();ctx.beginPath();ctx.rect(0,52,W,H-64);ctx.clip();
 const offset=H-phaseTime*creditsLayout.speed;
 for(const row of creditsLayout.rows){const y=offset+row.y;if(y>40&&y<H+20)text(row.value,W/2,y,row.size,row.color,'center');}
 ctx.restore();
} 
}
function frame(ms){if(!hostActive){last=ms;acc=0;requestAnimationFrame(frame);return;}let delta=Math.min((ms-last)/1000||0,.05);last=ms;acc+=delta;while(acc>=1/120){update(1/120);acc-=1/120;}draw();requestAnimationFrame(frame);}
reset();status.textContent='18 linternas. Una sorpresa.';requestAnimationFrame(frame);
})();
</script>
